<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href=".gitignore/img/pokeball.png" type="image/x-icon">
    <link rel="stylesheet" href=".gitignore/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./style/colors.css">
    <link rel="stylesheet" href="./style/card.css">
    <link rel="stylesheet" href="./style/header.css">
    <link rel="stylesheet" href="./style/overlay.css">
    <link rel="stylesheet" href="./style/evochain.css">
    <link rel="stylesheet" href="./style/footer.css">
    <link rel="stylesheet" href="./style/responsiveness.css">
    

    <script src="./script.js"></script>
    <script src="./script/template.js"></script>
    <script src="./script/special-function.js"></script>
    <script src="./script/filterbar.js"></script>
    <script src="./script/overlay.js"></script>
    <script src="./script/overlay-main.js"></script>
    <script src="./script/overlay-stats.js"></script>
    <script src="./script/overlay-evochain.js"></script>

    
    <title>Pokedex</title>
</head>
<body onload="render()">

     <header>
        <img class="pokeballIcon" src="./.gitignore/img/pokeball.png" alt="pokeball.png">

        <div>
            <div class="input-group mb-3">
                <input type="text" id="searchBarID" class="form-control" onkeyup="filterAndRenderPokemons()" placeholder="Search Pokemon" aria-label="Recipient’s username" aria-describedby="button-addon2">
        </div>
    </header>

    <div class="main-container">

    
    
   

    <div style="display: flex; justify-content: center; align-items: center; margin-top: 20px;">
        <h1  class="yellow-font">Pokedex</h1>
    </div>

    <section>
        
        <div onclick="toggleOverlay()"  class="overlay d_none" id="overlayID">
           
        </div>
        <div class="d_none" id="overlayContent">

           </div>
        <div class="card-order" id="content">

        </div>
    </section>

    <div id="loading">
        <div class="loading">
        <h2>loading...</h2>
        <img class="loading-spinner" src="./.gitignore/img/gifs/spinningPokeBall.gif" alt="Loading...">
        </div>
    </div>


    <section>
        <div  class="more-pokemon-button">
            <button id="morePokemonID" onclick="renderMorePokemons()" class="btn btn-warning padding-see-more-Button">see some more</button>
        </div>
    </section>

   

    </div>

     <footer>
        <div class="footer-content ">
            <div>
                <a href="" class="footer-link">contact</a>
                <a class="footer-link">|</a>
                <a href="" class="footer-link">impressum</a>
            </div>
        </div>
            <div>
                <img class="social-media-icons" src="./.gitignore/img/icons/social-media/instagram.png" alt="instagram">
                <img class="social-media-icons" src="./.gitignore/img/icons/social-media/facebook.png" alt="facebook">
                <img class="social-media-icons" src="./.gitignore/img/icons/social-media/youtube.png" alt="youtube">
            </div>
        </div>
    </footer>

</body>
</html>
